<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Brasileirão 2024</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Farsan&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,700;1,800;1,900&display=swap" rel="stylesheet">



  <style>


    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #32CD32, #1E90FF);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .quiz-container {
      background: rgba(218, 218, 218, 0.9);
      padding: 30px;
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #2e7d32;
    }
    .question {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .options button {
      background: none;
      border: 2px solid #1a7e11;
      color: #000000;
      font-size: 1rem;
      margin: 10px 0;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }
    .options button:hover {
      background: #cfac0f;
      color: #000000;
    }
    #score {
      font-size: 1.5rem;
      margin-top: 20px;
      color: #2e7d32;
    }
    #restart {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #32CD32;
      color: #fff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
    }
    #restart:hover {
      background-color: #228B22;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <h1>QUIZ BRASILEIRÃO 2025</h1>
  <div id="quiz">
    <div class="question" id="question">Carregando pergunta...</div>
    <div class="options" id="options"></div>
  </div>
  <div id="score" style="display: none;"></div>
  <button id="restart" style="display: none;">Jogar Novamente</button>
</div>

<script>
  const quizData = [
    {
      question: "Qual é o artilheiro do campeonato até agora?",
      options: ["Arrascaeta", "Pedro Raul", "Pedro", "Hulk"],
      answer: "Arrascaeta"
    },
    {
      question: "Quantos times vão rebaixar no Brasileirão 2025?",
      options: ["2", "3", "4", "5"],
      answer: "4"
    },
    {
      question: "Qual time está com a melhor média de gols",
      options: ["Flamengo", "Botafogo", "Atlético-MG", "Bahia"],
      answer: "Bahia"
    },
    {
      question: "Qual time está liderando o campeonato??",
      options: ["Flamengo", "São Paulo", "Flamengo", "Cruzeiro"],
      answer: "Flamengo"
    },
    {
      question: "Qual desses times subiu da Série B para o Brasileirão 2025?",
      options: ["Cruzeiro", "Vasco", "Santos", "Chapecoense"],
      answer: "Santos"
    }
  ];

  let currentQuestion = 0;
  let score = 0;

  const questionEl = document.getElementById('question');
  const optionsEl = document.getElementById('options');
  const scoreEl = document.getElementById('score');
  const restartBtn = document.getElementById('restart');

  function loadQuestion() {
    const current = quizData[currentQuestion];
    questionEl.textContent = current.question;
    optionsEl.innerHTML = '';
    current.options.forEach(option => {
      const button = document.createElement('button');
      button.textContent = option;
      button.onclick = () => selectOption(option);
      optionsEl.appendChild(button);
    });
  }

  function selectOption(option) {
    if (option === quizData[currentQuestion].answer) {
      score++;
    }
    currentQuestion++;
    if (currentQuestion < quizData.length) {
      loadQuestion();
    } else {
      showScore();
    }
  }

  function showScore() {
    quiz.style.display = 'none';
    scoreEl.style.display = 'block';
    restartBtn.style.display = 'inline-block';
    scoreEl.textContent = `Você acertou ${score} de ${quizData.length} perguntas!`;
  }

  restartBtn.addEventListener('click', () => {
    currentQuestion = 0;
    score = 0;
    quiz.style.display = 'block';
    scoreEl.style.display = 'none';
    restartBtn.style.display = 'none';
    loadQuestion();
  });

  loadQuestion();
</script>

</body>
</html>
